name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Core unit tests
        run: ./gradlew --no-daemon :core:test

      - name: Lint and debug APK
        run: ./gradlew --no-daemon :app:lintDebug :app:assembleDebug

      - name: Build record
        run: |
          apk=$(ls app/build/outputs/apk/debug/*.apk)
          {
            echo "source: ${GITHUB_SHA}"
            echo "ref: ${GITHUB_REF}"
            echo "run: ${GITHUB_RUN_ID}"
            echo "apk: $(basename "$apk")"
            echo "apk sha256: $(sha256sum "$apk" | cut -d' ' -f1)"
            echo "signing: CI debug key (changes per runner) - cannot update an installed build, see docs/RECOVERY.md"
          } | tee build-record.txt
          cat build-record.txt >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xposedteyes-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            build-record.txt
            app/build/reports/lint-results-debug.html
            core/build/reports/tests/test/
          if-no-files-found: warn
