# Unit tests, lint and a debug APK for every push and pull request.
# Actions are pinned to commit SHAs (tag in the comment).
name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: gradle/actions/wrapper-validation@42ebad84b0585498c0413b0967cf4e80ec0e1d19 # v4.4.1

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Unit tests, lint, debug APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Checksums
        run: |
          {
            echo "source_sha=${GITHUB_SHA}"
            echo "version=$(grep -o "versionName '[^']*'" build.gradle)"
            sha256sum build/outputs/apk/debug/*.apk
          } | tee build/outputs/apk/debug/BUILD-INFO.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xposedteyes-debug-${{ github.sha }}
          path: |
            build/outputs/apk/debug/*.apk
            build/outputs/apk/debug/BUILD-INFO.txt
          retention-days: 14

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: reports-${{ github.sha }}
          path: |
            build/reports/
            build/test-results/
          retention-days: 14
