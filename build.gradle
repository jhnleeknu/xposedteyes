// Build configuration for XposedTeyes.
//
// The legacy Eclipse/ADT layout (AndroidManifest.xml, src/, res/, assets/ at
// the repository root) is kept as-is and mapped onto Gradle source sets so the
// history of the existing files stays intact. Versions are pinned on purpose;
// see docs/BUILD.md before changing them.

plugins {
    id 'com.android.application' version '8.11.1'
}

android {
    namespace 'com.pijulius.xposedteyes'
    compileSdk 34

    defaultConfig {
        applicationId 'com.pijulius.xposedteyes'
        // minSdk/targetSdk intentionally unchanged from the original
        // AndroidManifest.xml (28/28). Changing targetSdk affects
        // MODE_WORLD_READABLE prefs sharing and background activity starts.
        minSdk 28
        //noinspection ExpiredTargetSdkVersion
        targetSdk 28
        versionCode 31
        versionName '3.1'
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
        test {
            java.srcDirs = ['test']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildTypes {
        debug {
            // Debug builds are signed with the per-machine debug key and are
            // NOT an update path for the original release APK (different
            // signature). See docs/BUILD.md.
        }
        release {
            minifyEnabled false
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds false
        lintConfig file('lint.xml')
        baseline file('lint-baseline.xml')
    }

    testOptions {
        unitTests.returnDefaultValues = false
    }
}

dependencies {
    // Xposed API is provided by the framework at runtime and must not be packaged.
    compileOnly files('lib/api-82.jar')

    testImplementation 'junit:junit:4.13.2'
    // android.jar only contains stubs for org.json; use the real one in JVM tests.
    testImplementation 'org.json:json:20231013'
}
